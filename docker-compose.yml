services:
  ml-service:
    build: ./ml-service
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service/model:/app/model

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - FASTAPI_URL=http://ml-service:8001
    depends_on:
      - ml-service

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
